# YAML配置文件适用于Ultralytics框架（基于YOLOv9s结构改进）
#based on yolov9
nc: 1  # 你的单一标注类别数量
scales:
  s: [0.50, 0.50, 1024]  # 深度、宽度、最大通道数缩放因子，基于你的显存调整

# 网络结构开始
backbone:
  # 初始卷积层 [from, repeats, module, args]
  - [-1, 1, Conv, [32, 3, 1]]  # 减少初始输出通道，保护小目标细节

  # 高分辨率浅层分支 (针对小目标)
  - [-1, 1, Conv, [64, 3, 2]]  # 下采样
  - [-1, 1, C2f, [64, True]]   # 保留丰富空间信息
  - [-1, 1, CBAM, [64]]        # 添加注意力机制，增强遮挡目标关键特征:cite[4]
  - [-1, 1, Conv, [128, 3, 2]] # 继续下采样
  - [-1, 2, C2f, [128, True]]  # 特征处理
  - [-1, 1, CBAM, [128]]       # 注意力机制

  # 深层语义分支
  - [-1, 1, Conv, [256, 3, 2]] # 下采样获取语义信息
  - [-1, 3, C2f, [256, True]]  # 深层特征提取
  - [-1, 1, CBAM, [256]]       # 语义层注意力

  # 特征金字塔结构 :cite[2]
  - [-1, 1, SPPF, [256, 5]]    # 空间金字塔池化，融合多尺度上下文

head:
  # 上采样路径1 (连接深层语义特征)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]  # 拼接骨干网中层特征
  - [-1, 1, C2f, [128, False]] # 特征融合处理
  - [-1, 1, CBAM, [128]]       # 注意力机制优化融合特征

  # 上采样路径2 (连接浅层高分辨率特征)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 3], 1, Concat, [1]]  # 拼接骨干网浅层高分辨率特征
  - [-1, 1, C2f, [64, False]]  # 高分辨率特征处理
  - [-1, 1, CBAM, [64]]        # 注意力机制优化

  # 检测头 - 多尺度输出:cite[6]
  - [[-1, 7, 11], 1, Detect, [nc]]  # 3个尺度的检测层，适应不同大小目标