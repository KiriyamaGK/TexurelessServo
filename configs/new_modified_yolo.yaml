# 针对200张图片、中小尺度、遮挡敏感、8G显存的YOLO网络
#based on yolov8
nc: 1  # 你的类别数，根据你的数据集修改
scales:
  s: [0.50, 0.50, 1024]  # 深度、宽度、最大通道数缩放因子，控制模型大小

# 网络结构
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [32, 3, 2]]  # 0-P1/2, 初始卷积，降低计算量
  - [-1, 1, Conv, [64, 3, 2]]  # 1-P2/4
  - [-1, 1, C2f, [64]]         # 2
  - [-1, 1, Conv, [128, 3, 2]] # 3-P3/8
  - [-1, 2, C2f, [128]]        # 4
  - [-1, 1, Conv, [256, 3, 2]] # 5-P4/16
  - [-1, 3, C2f, [256]]        # 6
  - [-1, 1, Conv, [512, 3, 2]] # 7-P5/32
  - [-1, 1, C2f, [512]]        # 8
  - [-1, 1, SPPF, [512, 5]]    # 9 空间金字塔池化，融合多尺度上下文:cite[4]

head:
  # 上采样并融合深层特征
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] #10
  - [[-1, 6], 1, Concat, [1]]  # 11 拼接骨干网中层特征(索引6)
  - [-1, 1, C2f, [256]]        # 12

  # 继续上采样并融合浅层高分辨率特征
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] #13
  - [[-1, 4], 1, Concat, [1]]  # 14 拼接骨干网浅层特征(索引4)，引入高分辨率信息:cite[6]
  - [-1, 1, C2f, [128]]        # 15

  # 多尺度检测输出
  - [[15, 12, 9], 1, Detect, [nc]]  # 16 三个尺度的检测层，适应不同大小目标