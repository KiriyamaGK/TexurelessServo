# Ultra-Light Part Detector - FIXED VERSION
# 修复了特征图尺寸不匹配的问题

nc: 1  # 单一类别
scales:
  nano: [0.25, 0.25, 512]

# 骨干网络 - 确保下采样倍数正确
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [16, 3, 2]]   # 0-P1/2 (320x320)
  - [-1, 1, Conv, [32, 3, 2]]   # 1-P2/4 (160x160)
  - [-1, 1, C2f, [32]]          # 2 (160x160)
  - [-1, 1, Conv, [64, 3, 2]]   # 3-P3/8 (80x80)
  - [-1, 1, C2f, [64]]          # 4 (80x80) - 浅层特征
  - [-1, 1, Conv, [128, 3, 2]]  # 5-P4/16 (40x40)
  - [-1, 1, C2f, [128]]         # 6 (40x40) - 中层特征
  - [-1, 1, Conv, [256, 3, 2]]  # 7-P5/32 (20x20)
  - [-1, 1, C2f, [256]]         # 8 (20x20)
  - [-1, 1, SPPF, [256, 5]]     # 9 (20x20) - 深层特征

# 检测头 - 修正特征融合路径
head:
  # 上采样路径 P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 10 (40x40)
  - [[-1, 6], 1, Concat, [1]]   # 11 拼接P4特征 (40x40)
  - [-1, 1, C2f, [128]]         # 12 (40x40)

  # 上采样路径 P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]  # 13 (80x80)
  - [[-1, 4], 1, Concat, [1]]   # 14 拼接P3特征 (80x80)
  - [-1, 1, C2f, [64]]          # 15 (80x80) - P3输出

  # 下采样路径 P3 -> P4
  - [-1, 1, Conv, [64, 3, 2]]   # 16 (40x40)
  - [[-1, 12], 1, Concat, [1]]  # 17 拼接P4特征 (40x40)
  - [-1, 1, C2f, [128]]         # 18 (40x40) - P4输出

  # 下采样路径 P4 -> P5
  - [-1, 1, Conv, [128, 3, 2]]  # 19 (20x20)
  - [[-1, 9], 1, Concat, [1]]   # 20 拼接P5特征 (20x20)
  - [-1, 1, C2f, [256]]         # 21 (20x20) - P5输出

  # 三尺度检测
  - [[15, 18, 21], 1, Detect, [nc]]  # 22